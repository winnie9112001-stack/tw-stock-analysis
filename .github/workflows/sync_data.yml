name: Sync TWSE Stock & Industry Data

on:
  schedule:
    # 每個工作日台灣時間下午 15:30 (UTC 07:30) 自動執行抓取最新收盤與基本面
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 介面上一鍵手動觸發

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch TWSE / TPEx OpenData & Update Stock Quotes
        run: |
          node scripts/sync_stock_data.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_quotes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): 自動同步最新台股食品類報價與基本面" && git push)
